name: Sync and Scan — notion-sync → truth-catcher

# Manual only. Since 2026-10-08 the scheduled scan runs as the Claude Routine
# "Truth Catcher scan" (agents/truth-catcher.md, "Routine run"), which needs no
# ANTHROPIC_API_KEY credits. Each job runs a cheap API check first and only calls
# Claude when the source changed (or when dispatched with force=true).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the change checks and run Claude anyway"
        type: boolean
        default: false

concurrency:
  group: truth-cache
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLAUDE_CODE_USE_BEDROCK: "0"
  DISABLE_AUTOUPDATER: "1"
  DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_ROOT_DATABASE_ID: ${{ secrets.NOTION_ROOT_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .truth-cache
          key: truth-cache-${{ github.run_id }}-sync
          restore-keys: truth-cache-

      - name: Check Notion for changes
        id: gate
        run: npx -y tsx scripts/gate.ts notion

      - name: Install Claude Code
        if: steps.gate.outputs.changed == 'true' || inputs.force
        run: npm install -g @anthropic-ai/claude-code

      - name: Run notion-sync (Haiku)
        if: steps.gate.outputs.changed == 'true' || inputs.force
        run: >
          scripts/run-agent.sh claude-haiku-4-5-20251001 15
          "Read,Write,Edit,Glob,Grep,mcp__notion"
          "Run the notion-sync agent: read dream.md §2–3 and agents/notion-sync.md, then execute its workflow. Trigger: schedule — sync."

  scan:
    needs: sync
    # Run even if notion-sync failed: the scan syncs the roadmap itself
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # escalation issues
    env:
      # Truth Catcher has its own live switches (repo variables), independent of the global DRY_RUN
      DRY_RUN: ${{ vars.TRUTH_CATCHER_LIVE == 'true' && 'false' || 'true' }}
      DELAY_DRY_RUN: ${{ vars.TRUTH_CATCHER_DELAY_LIVE == 'true' && 'false' || 'true' }}
      GITHUB_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_CURAGENT_TOKEN || secrets.ASANA_ACCESS_TOKEN }}
      ASANA_PROJECT_GID: ${{ secrets.ASANA_PROJECT_GID || '1204489225205419' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .truth-cache
          key: truth-cache-${{ github.run_id }}-scan
          restore-keys: truth-cache-

      - name: Check Asana for changes
        id: gate
        run: npx -y tsx scripts/gate.ts asana

      - name: Prepare scan (roadmap sync + Asana fetch + rule checks, no LLM)
        id: prepare
        if: steps.gate.outputs.changed == 'true' || inputs.force
        run: npx -y tsx scripts/truth-scan.ts prepare

      - name: Install Claude Code
        if: steps.prepare.outputs.needs_judgement == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Judge unlinked tasks (Sonnet)
        if: steps.prepare.outputs.needs_judgement == 'true'
        run: >
          scripts/run-agent.sh claude-sonnet-5-5 12
          "Read,Write"
          "Run the truth-catcher agent: read agents/truth-catcher.md and do Step 2 only — judge the unlinked tasks and delay candidates in .truth-cache/scan-input.json and write .truth-cache/scan-decisions.json."

      - name: Post comments (dry run unless DRY_RUN=false)
        if: steps.gate.outputs.changed == 'true' || inputs.force
        run: npx -y tsx scripts/truth-scan.ts post
