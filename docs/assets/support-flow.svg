<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <style>
    .h{font-family:"Futura LT Pro","Futura","Century Gothic",Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px}
    .l{font-family:"Info Display Pro","Helvetica Neue",Helvetica,Arial,sans-serif}
  </style>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="52" text-anchor="middle" class="h" font-size="26" fill="#04090B">HOW SUPPORT WORKS</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#706F6F"/>
    </marker>
  </defs>
  <!-- inputs -->
  <rect x="60" y="110" width="300" height="78" rx="39" fill="#EDEDED"/>
  <text x="210" y="140" text-anchor="middle" class="h" font-size="15" fill="#04090B">BOB SUPPORT MAILBOX</text>
  <text x="210" y="166" text-anchor="middle" class="l" font-size="15" fill="#04090B">info@bobscore.com</text>
  <text x="210" y="183" text-anchor="middle" class="l" font-size="12" fill="#706F6F">support@bobscore.com also watched</text>
  <rect x="60" y="222" width="300" height="78" rx="39" fill="#EDEDED"/>
  <text x="210" y="256" text-anchor="middle" class="h" font-size="15" fill="#04090B">CURAPROX APP MAILBOX</text>
  <text x="210" y="280" text-anchor="middle" class="l" font-size="15" fill="#04090B">curaden.apps@curaden.ch</text>
  <rect x="60" y="334" width="300" height="78" rx="39" fill="#EDEDED"/>
  <text x="210" y="368" text-anchor="middle" class="h" font-size="15" fill="#04090B">ASANA FORM</text>
  <text x="210" y="392" text-anchor="middle" class="l" font-size="15" fill="#04090B">App Requests &amp; Feedback</text>
  <!-- claude -->
  <rect x="470" y="178" width="260" height="90" rx="45" fill="#003DA5"/>
  <text x="600" y="217" text-anchor="middle" class="h" font-size="16" fill="#FFFFFF">CLAUDE</text>
  <text x="600" y="243" text-anchor="middle" class="l" font-size="15" fill="#FFFFFF">via Outlook MCP</text>
  <!-- board -->
  <rect x="840" y="208" width="300" height="104" rx="52" fill="#003DA5"/>
  <text x="990" y="250" text-anchor="middle" class="h" font-size="16" fill="#FFFFFF">ASANA BOARD</text>
  <text x="990" y="276" text-anchor="middle" class="l" font-size="15" fill="#FFFFFF">One triage list</text>
  <!-- connectors -->
  <path d="M360,149 C420,149 420,210 466,215" fill="none" stroke="#706F6F" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M360,261 C420,261 420,236 466,233" fill="none" stroke="#706F6F" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M730,223 C790,223 790,245 836,248" fill="none" stroke="#706F6F" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M360,373 C600,373 760,330 860,300" fill="none" stroke="#706F6F" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <rect x="566" y="335" width="132" height="28" rx="14" fill="#FFFFFF"/>
  <text x="632" y="355" text-anchor="middle" class="l" font-size="14" fill="#706F6F">Already direct</text>
  <!-- bottom bar -->
  <path d="M990,312 L990,436" fill="none" stroke="#706F6F" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="60" y="440" width="1080" height="72" rx="36" fill="#EDEDED"/>
  <text x="600" y="483" text-anchor="middle" class="l" font-size="17" fill="#04090B"><tspan class="h" font-size="16">JANINE:</tspan> checks mailbox requests, adds them to Asana when needed · <tspan class="h" font-size="16">FORM REQUESTS:</tspan> owner assigned in Asana</text>
</svg>
